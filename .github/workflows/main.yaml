name: Checking Code Quality

on:
  - push
  - pull_request

jobs:
  eslint:
    name: Run Code Quality Static Checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install dependencies without prepare script
        run: npm install --ignore-scripts

      - name: Fix permissions recursively for husky
        run: chmod -R +x ./node_modules/husky

      - name: Check husky folder permissions
        run: ls -la node_modules/husky

      - name: Run husky install directly
        run: ./node_modules/.bin/husky install

      - name: Run ESLint
        run: npm run lint
        continue-on-error: true
