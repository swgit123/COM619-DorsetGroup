name: Checking security credentials/keys

on:
  - push

jobs:
  eslint:
    name: Run Security Static Checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run TruffleHog (secret scan)
        uses: trufflesecurity/trufflehog@main
        with:
          # Ask TruffleHog to show verified + unknown results. Adjust as needed.
          extra_args: --results=verified,unknown

      # Note: TruffleHog prints findings to the job log. If you want the
      # raw JSON output or SARIF uploaded as an artifact, we can capture
      # stdout into a file by running the CLI directly or adjust the
      # action usage. Tell me if you'd like artifacts or SARIF uploads.
