name: Checking security credentials/keys

on:
  - push

jobs:
  eslint:
    name: Run Security Static Checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run trufflehog (git scan)
        uses: trufflesecurity/trufflehog-action@v1
        with:
          # scan the repo contents on the runner
          scan-path: .
          # enable git history scanning to find historical secrets
          enable-git: true
          # set output format to sarif if you want to upload to GitHub's code scanning UI
          format: sarif

      - name: Upload TruffleHog SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: trufflehog.sarif
