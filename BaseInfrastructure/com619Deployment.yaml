apiVersion: apps/v1
kind: Deployment
metadata:
  name: com619-deployment
  labels:
    app: com619-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: com619-app
  template:
    metadata:
      labels:
        app: com619-app
    spec:
      containers:
        - name: com619-container
          image: 114788392298.dkr.ecr.eu-west-2.amazonaws.com/com619app:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
            - name: COUCHDB_URL
              value: "http://couchdb:5984"
            - name: USER_NAME
              value: ""
            - name: PASSWORD
              value: ""
            - name: SERVER_URL
              value: "http://localhost:5000"
            - name: API_KEY
              value: ""
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      imagePullSecrets:
        - name: ecr-registry-secret
---
apiVersion: v1
kind: Service
metadata:
  name: com619-service
spec:
  type: NodePort
  selector:
    app: com619-app
  ports:
    - port: 3000
      targetPort: 3000
