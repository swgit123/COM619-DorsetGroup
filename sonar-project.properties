# SonarQube Project Configuration
# Replace these values with your actual SonarQube Cloud project details

sonar.projectKey=YOUR_PROJECT_KEY
sonar.organization=YOUR_ORGANIZATION_KEY

# Project metadata
sonar.projectName=COM619 Project
sonar.projectVersion=1.0

# Source code paths
sonar.sources=src,backend
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/coverage/**,**/__pycache__/**,**/venv/**

# Coverage paths (update if you have test coverage)
# sonar.javascript.lcov.reportPaths=coverage/lcov.info
# sonar.python.coverage.reportPaths=coverage.xml

# Language-specific settings
sonar.sourceEncoding=UTF-8
